<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360"
  text-rendering="geometricPrecision" shape-rendering="geometricPrecision"
  role="img" aria-label="Harness Protocol - the open standard for AI coding harnesses">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090c11"/>
      <stop offset="0.58" stop-color="#0b0f15"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0.71" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#22b1ec" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#22b1ec" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22b1ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="codeSurface" x1="760" y1="56" x2="1114" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#0d1218"/>
    </linearGradient>
    <filter id="panelShadow" x="-14%" y="-16%" width="128%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .display { font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .sans    { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono    { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#page)"/>
  <rect width="1280" height="360" fill="url(#accentGlow)"/>

  <path d="M80 300H1200" stroke="#e6eeff" stroke-opacity="0.08"/>
  <path d="M80 60H1200" stroke="#e6eeff" stroke-opacity="0.05"/>
  <path d="M80 60V300" stroke="#e6eeff" stroke-opacity="0.05"/>
  <path d="M1200 60V300" stroke="#e6eeff" stroke-opacity="0.05"/>

  <g transform="translate(80 70)">
    <!-- Logo: exact icon.svg geometry, scaled to match 58px circle diameter -->
    <!-- icon.svg: circle r=62 centered at (100,100) in 200x200 viewBox        -->
    <!-- Target: r=28 centered at (29,29). Scale = 28/62 = 0.452               -->
    <!-- Translate = (29 - 100*0.452, 29 - 100*0.452) = (-16.2, -16.2)         -->
    <g transform="translate(-16.2 -16.2) scale(0.452)">
      <circle cx="100" cy="100" r="90" fill="#131110"/>
      <circle cx="100" cy="100" r="62" fill="none" stroke="#60a5fa" stroke-width="6"/>
      <line x1="100"    y1="58"  x2="63.63"  y2="121" stroke="#60a5fa" stroke-width="3" opacity="0.4"/>
      <line x1="63.63"  y1="121" x2="136.37" y2="121" stroke="#60a5fa" stroke-width="3" opacity="0.4"/>
      <line x1="136.37" y1="121" x2="100"    y2="58"  stroke="#60a5fa" stroke-width="3" opacity="0.4"/>
      <circle cx="100"   cy="58"  r="10" fill="#e8e0d6"/>
      <circle cx="63.63" cy="121" r="10" fill="#e8e0d6"/>
      <circle cx="136.37" cy="121" r="10" fill="#e8e0d6"/>
    </g>

    <text x="82" y="18"  class="mono"    font-size="14"   font-weight="500" fill="#9aa0ad">// v1 specification</text>
    <text x="82" y="76"  class="display" font-size="58"   font-weight="700" letter-spacing="-1" fill="#f5f7fb">Harness Protocol</text>
    <text x="84" y="116" class="sans"    font-size="20"   font-weight="400" fill="#9aa0ad">The open standard for AI coding harnesses.</text>

    <g transform="translate(84 148)">
      <rect x="0"   y="0" width="152" height="34" rx="8" fill="#22b1ec" fill-opacity="0.12" stroke="#22b1ec" stroke-opacity="0.28" stroke-width="1"/>
      <text x="16"  y="22" class="mono" font-size="13" font-weight="500" fill="#8bdaf6">harness.yaml</text>
      <rect x="168" y="0" width="164" height="34" rx="8" fill="#737b8c" fill-opacity="0.10" stroke="#e6eeff" stroke-opacity="0.12" stroke-width="1"/>
      <text x="184" y="22" class="sans" font-size="13" font-weight="500" fill="#c8d0dc">Portable by design</text>
    </g>
  </g>

  <g transform="translate(744 54)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="400" height="252" rx="14" fill="url(#codeSurface)" stroke="#e6eeff" stroke-opacity="0.14" stroke-width="1"/>
    <rect x="0" y="0" width="400" height="42" rx="14" fill="#07090d"/>
    <path d="M0 28H400V43H0V28Z" fill="#07090d"/>
    <circle cx="20" cy="21" r="5" fill="#303844"/>
    <circle cx="38" cy="21" r="5" fill="#303844"/>
    <circle cx="56" cy="21" r="5" fill="#303844"/>
    <text x="200" y="26" text-anchor="middle" class="mono" font-size="13" font-weight="500" fill="#737b8c">harness.yaml</text>

    <g class="mono" font-size="13.5" font-weight="500">
      <text x="26" y="73" ><tspan fill="#4ec7f2">version</tspan><tspan fill="#6f7785">: </tspan><tspan fill="#cbc8c2">"1"</tspan></text>
      <text x="26" y="99" ><tspan fill="#4ec7f2">metadata</tspan><tspan fill="#6f7785">:</tspan></text>
      <text x="48" y="125"><tspan fill="#4ec7f2">name</tspan><tspan fill="#6f7785">: </tspan><tspan fill="#e6e8ee">data-engineer</tspan></text>
      <text x="26" y="151"><tspan fill="#4ec7f2">plugins</tspan><tspan fill="#6f7785">:</tspan></text>
      <text x="48" y="177"><tspan fill="#6f7785">- </tspan><tspan fill="#4ec7f2">source</tspan><tspan fill="#6f7785">: </tspan><tspan fill="#e6e8ee">acme/sql-explorer</tspan></text>
      <text x="26" y="203"><tspan fill="#4ec7f2">mcp-servers</tspan><tspan fill="#6f7785">:</tspan></text>
      <text x="48" y="229"><tspan fill="#e6e8ee">filesystem</tspan><tspan fill="#6f7785">: </tspan><tspan fill="#737b8c">...</tspan></text>
    </g>
  </g>

  <g transform="translate(747 326)" class="display">
    <text x="0"   y="0" font-size="13" font-weight="500" fill="#737b8c">Any tool</text>
    <path d="M72 -4H174" stroke="#e6eeff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="124" cy="-4" r="4" fill="#22b1ec"/>
    <text x="198" y="0" font-size="13" font-weight="600" fill="#f5f7fb">One profile</text>
    <path d="M286 -4H388" stroke="#e6eeff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="338" cy="-4" r="4" fill="#22b1ec"/>
    <text x="412" y="0" font-size="13" font-weight="500" fill="#737b8c">Any team</text>
  </g>
</svg>
