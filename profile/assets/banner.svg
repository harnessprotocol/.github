<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harness Protocol — the open standard for AI coding harnesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0b0d12"/>
      <stop offset="0.6"  stop-color="#0f1218"/>
      <stop offset="1"    stop-color="#12151c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.32" r="0.52">
      <stop offset="0"   stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="1"   stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace; }
      .sans { font-family: ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <line x1="1" y1="0" x2="1" y2="360" stroke="rgba(230,238,255,0.04)" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="360" stroke="rgba(230,238,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="180" x2="1280" y2="180" stroke="rgba(230,238,255,0.03)" stroke-width="1"/>

  <g transform="translate(80, 76) scale(0.44)">
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#logoRing)" stroke-width="6"/>
    <line x1="100" y1="38" x2="61.7" y2="107" stroke="#78706a" stroke-width="2.8" opacity="0.55"/>
    <line x1="61.7" y1="107" x2="138.3" y2="107" stroke="#78706a" stroke-width="2.8" opacity="0.55"/>
    <line x1="138.3" y1="107" x2="100" y2="38" stroke="#78706a" stroke-width="2.8" opacity="0.55"/>
    <circle cx="100"   cy="38"  r="10" fill="#e8e0d6"/>
    <circle cx="61.7"  cy="107" r="10" fill="#e8e0d6"/>
    <circle cx="138.3" cy="107" r="10" fill="#e8e0d6"/>
  </g>

  <text x="157" y="113" class="sans" font-size="13" font-weight="600" letter-spacing="0.5" fill="#0ea5e9">// v1 specification</text>

  <text x="80" y="194" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#e6e8ee">Harness Protocol</text>

  <text x="82" y="238" class="sans" font-size="22" font-weight="400" fill="#9aa0ad">The open standard for AI coding harnesses.</text>

  <g transform="translate(82, 263)">
    <rect x="0" y="0" width="170" height="33" rx="16.5" fill="rgba(14,165,233,0.10)" stroke="rgba(14,165,233,0.40)" stroke-width="1"/>
    <circle cx="20" cy="16.5" r="3.5" fill="#0ea5e9"/>
    <text x="34" y="22" class="mono" font-size="14" fill="#7dd3fc">harness.yaml</text>
  </g>

  <g transform="translate(786, 62)">
    <rect x="0" y="0" width="416" height="236" rx="14" fill="#1a1e27" stroke="rgba(230,238,255,0.08)" stroke-width="1"/>
    <rect x="0" y="0" width="416" height="42" rx="14" fill="#12100e"/>
    <rect x="0" y="28" width="416" height="14" fill="#12100e"/>
    <circle cx="20" cy="21" r="5" fill="rgba(255,255,255,0.10)"/>
    <circle cx="38" cy="21" r="5" fill="rgba(255,255,255,0.10)"/>
    <circle cx="56" cy="21" r="5" fill="rgba(255,255,255,0.10)"/>
    <text x="208" y="26" text-anchor="middle" class="mono" font-size="12" fill="rgba(255,255,255,0.28)">harness.yaml</text>

    <g class="mono" font-size="14.5">
      <text x="24" y="76"><tspan fill="#7dd3fc">version</tspan><tspan fill="rgba(255,255,255,0.22)">: </tspan><tspan fill="#a5b4fc">"1"</tspan></text>
      <text x="24" y="100"><tspan fill="#7dd3fc">metadata</tspan><tspan fill="rgba(255,255,255,0.22)">:</tspan></text>
      <text x="44" y="124"><tspan fill="#7dd3fc">name</tspan><tspan fill="rgba(255,255,255,0.22)">: </tspan><tspan fill="#cbc7c2">data-engineer</tspan></text>
      <text x="24" y="148"><tspan fill="#7dd3fc">plugins</tspan><tspan fill="rgba(255,255,255,0.22)">:</tspan></text>
      <text x="44" y="172"><tspan fill="rgba(255,255,255,0.22)">- </tspan><tspan fill="#7dd3fc">source</tspan><tspan fill="rgba(255,255,255,0.22)">: </tspan><tspan fill="#86efac">acme/sql-explorer</tspan></text>
      <text x="24" y="196"><tspan fill="#7dd3fc">mcp-servers</tspan><tspan fill="rgba(255,255,255,0.22)">:</tspan></text>
      <text x="44" y="220"><tspan fill="#cbc7c2">filesystem</tspan><tspan fill="rgba(255,255,255,0.22)">: </tspan><tspan fill="rgba(255,255,255,0.28)">…</tspan></text>
    </g>
  </g>

  <g transform="translate(786, 322)">
    <line x1="56" y1="0" x2="208" y2="0" stroke="rgba(230,238,255,0.06)" stroke-width="1.5"/>
    <line x1="208" y1="0" x2="360" y2="0" stroke="rgba(230,238,255,0.06)" stroke-width="1.5"/>
    <g class="sans" font-size="11.5" font-weight="600" fill="#6b7280" text-anchor="middle">
      <g>
        <circle cx="56"  cy="0" r="5" fill="#12151c" stroke="rgba(14,165,233,0.35)" stroke-width="1.5"/>
        <text x="56"  y="19">Any tool</text>
      </g>
      <g>
        <circle cx="208" cy="0" r="5" fill="#0ea5e9"/>
        <text x="208" y="19" fill="#0ea5e9">Portable</text>
      </g>
      <g>
        <circle cx="360" cy="0" r="5" fill="#12151c" stroke="rgba(14,165,233,0.35)" stroke-width="1.5"/>
        <text x="360" y="19">Any team</text>
      </g>
    </g>
