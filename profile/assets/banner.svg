<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harness Protocol — the open standard for AI coding harnesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#0c1626"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0b9bd4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b9bd4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b9bd4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace; }
      .sans { font-family: ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <!-- field -->
  <rect width="1280" height="360" rx="0" fill="url(#bg)"/>
  <ellipse cx="980" cy="120" rx="420" ry="300" fill="url(#glow)"/>

  <!-- subtle dotted texture, left -->
  <g fill="#1b2a40">
    <circle cx="80" cy="300" r="2"/><circle cx="116" cy="300" r="2"/><circle cx="152" cy="300" r="2"/>
    <circle cx="80" cy="320" r="2"/><circle cx="116" cy="320" r="2"/><circle cx="152" cy="320" r="2"/>
    <circle cx="80" cy="340" r="2" fill="#0b9bd4"/><circle cx="116" cy="340" r="2"/><circle cx="152" cy="340" r="2"/>
  </g>

  <!-- ── left: wordmark + tagline ── -->
  <!-- mark: linked brackets -->
  <g transform="translate(80,84)">
    <rect x="0" y="0" width="52" height="52" rx="13" fill="#0e1b2e" stroke="#1e3a52" stroke-width="1.5"/>
    <path d="M20 16 L13 26 L20 36" stroke="url(#cyan)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M32 16 L39 26 L32 36" stroke="url(#cyan)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="26" cy="26" r="2.4" fill="#22d3ee"/>
  </g>

  <text x="152" y="122" class="sans" font-size="15" font-weight="600" letter-spacing="3.5" fill="#22d3ee">OPEN SPECIFICATION</text>

  <text x="80" y="196" class="sans" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#f1f5f9">Harness Protocol</text>

  <text x="82" y="240" class="sans" font-size="23" font-weight="400" fill="#94a3b8">The open standard for AI coding harnesses.</text>

  <!-- harness.yaml pill -->
  <g transform="translate(82,266)">
    <rect x="0" y="0" width="168" height="34" rx="17" fill="#0b9bd4" fill-opacity="0.12" stroke="#0b9bd4" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="22" cy="17" r="4" fill="#22d3ee"/>
    <text x="38" y="22" class="mono" font-size="15" fill="#7dd3fc">harness.yaml</text>
  </g>

  <!-- ── right: code card ── -->
  <g transform="translate(792,70)">
    <rect x="0" y="0" width="408" height="220" rx="16" fill="#0d1828" stroke="#1e3a52" stroke-width="1.5"/>
    <!-- title bar -->
    <rect x="0" y="0" width="408" height="40" rx="16" fill="#11243a"/>
    <rect x="0" y="24" width="408" height="16" fill="#11243a"/>
    <circle cx="22" cy="20" r="5" fill="#f87171"/>
    <circle cx="42" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="62" cy="20" r="5" fill="#34d399"/>
    <text x="204" y="25" text-anchor="middle" class="mono" font-size="12.5" fill="#64748b">harness.yaml</text>

    <!-- code body -->
    <g class="mono" font-size="15">
      <text x="26" y="76"><tspan fill="#7dd3fc">version</tspan><tspan fill="#64748b">: </tspan><tspan fill="#a5b4fc">"1"</tspan></text>
      <text x="26" y="102"><tspan fill="#7dd3fc">metadata</tspan><tspan fill="#64748b">:</tspan></text>
      <text x="46" y="128"><tspan fill="#7dd3fc">name</tspan><tspan fill="#64748b">: </tspan><tspan fill="#e2e8f0">data-engineer</tspan></text>
      <text x="26" y="154"><tspan fill="#7dd3fc">plugins</tspan><tspan fill="#64748b">:</tspan></text>
      <text x="46" y="180"><tspan fill="#64748b">- </tspan><tspan fill="#7dd3fc">source</tspan><tspan fill="#64748b">: </tspan><tspan fill="#86efac">acme/sql-explorer</tspan></text>
      <text x="26" y="206"><tspan fill="#7dd3fc">mcp-servers</tspan><tspan fill="#64748b">: </tspan><tspan fill="#475569">…</tspan></text>
    </g>
  </g>

  <!-- portability nodes under the card -->
  <g transform="translate(792,308)">
    <line x1="60" y1="0" x2="204" y2="0" stroke="#1e3a52" stroke-width="1.5"/>
    <line x1="204" y1="0" x2="348" y2="0" stroke="#1e3a52" stroke-width="1.5"/>
    <g class="sans" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
      <g><circle cx="60" cy="0" r="6" fill="#0d1828" stroke="#0b9bd4" stroke-width="1.5"/><text x="60" y="22">Any tool</text></g>
      <g><circle cx="204" cy="0" r="6" fill="#0b9bd4"/><text x="204" y="22" fill="#7dd3fc">Portable</text></g>
      <g><circle cx="348" cy="0" r="6" fill="#0d1828" stroke="#0b9bd4" stroke-width="1.5"/><text x="348" y="22">Any team</text></g>
    </g>
  </g>
</svg>
